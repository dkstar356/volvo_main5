<script>
const mediaPath='assets/video/volvo_xc90.mp4',screen=document.getElementById('screen'),play=document.getElementById('play'),player=document.getElementById('player'),video=document.getElementById('video'),close=document.getElementById('close');let mediaUrl;
function resize(){screen.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',resize);resize();
function initVideo(){if(mediaUrl)return;mediaUrl=mediaPath;video.src=mediaUrl}
async function start(){initVideo();document.getElementById('error').style.display='none';player.classList.add('open');player.setAttribute('aria-hidden','false');video.currentTime=0;try{await video.play();video.focus()}catch(e){document.getElementById('error').style.display='block';close.focus()}}
function stop(){video.pause();player.classList.remove('open');player.setAttribute('aria-hidden','true');play.focus()}
document.getElementById('home').addEventListener('click',()=>{stop();parent.postMessage({type:'volvo-return-home'},'*')});document.querySelectorAll('.react').forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')));play.addEventListener('click',start);close.addEventListener('click',stop);video.addEventListener('ended',stop);video.addEventListener('error',()=>{document.getElementById('error').style.display='block'});
addEventListener('keydown',e=>{const active=player.classList.contains('open');if(e.key==='Escape'&&active){e.preventDefault();stop()}else if(!active&&e.key.startsWith('Arrow')){e.preventDefault();play.focus()}else if(active&&(e.key===' '||e.key==='Enter')&&document.activeElement!==close){e.preventDefault();video.paused?video.play():video.pause()}else if(!active&&e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();start()}});
</script><script>
addEventListener('keydown', e => {
  const playing=document.getElementById('player').classList.contains('open');
  if (['Backspace','BrowserBack','GoBack','Home'].includes(e.key) || (e.key==='Escape' && !playing)) {
    e.preventDefault();e.stopImmediatePropagation();
    if(playing && e.key!=='Home') document.getElementById('close').click();
    else parent.postMessage({type:'volvo-return-home'},'*');
  }
},true);
document.getElementById('play').focus();
</script></body></html>
